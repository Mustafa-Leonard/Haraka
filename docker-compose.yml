# ── Haraka Platform — Docker Compose ────────────────────────────────────────
# Usage:
#   docker compose up -d
#   docker compose exec api pnpm db:migrate
#   docker compose exec api pnpm db:seed

version: '3.9'

networks:
  haraka:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  caddy_data:
  caddy_certs:

services:
  # ── Database ──────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    networks: [haraka]
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: haraka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: haraka
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U haraka -d haraka']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache / Queue ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [haraka]
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ── API ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    networks: [haraka]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://haraka:${POSTGRES_PASSWORD}@postgres:5432/haraka?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?required}
      COOKIE_SECRET: ${COOKIE_SECRET:?required}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?required}
      FIELD_ENCRYPTION_KEY_ID: ${FIELD_ENCRYPTION_KEY_ID:-v1}
      MPESA_ENV: ${MPESA_ENV:?required}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
      AT_ENV: ${AT_ENV:?required}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_USERNAME: ${AT_USERNAME:-sandbox}
      AT_SENDER_ID: ${AT_SENDER_ID:-Haraka}
      CORS_ORIGINS: ${CORS_ORIGINS:?required}
      API_HOST: 0.0.0.0
      API_PORT: 3000
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health/ready || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Background Worker ─────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    restart: unless-stopped
    networks: [haraka]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://haraka:${POSTGRES_PASSWORD}@postgres:5432/haraka?schema=public
      REDIS_URL: redis://redis:6379
      AT_ENV: ${AT_ENV:?required}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_USERNAME: ${AT_USERNAME:-sandbox}
      AT_SENDER_ID: ${AT_SENDER_ID:-Haraka}

  # ── Web Frontend ──────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    restart: unless-stopped
    networks: [haraka]
    depends_on: [api]

  # ── Reverse Proxy ─────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks: [haraka]
    depends_on: [api, web]
    volumes:
      - ./infrastructure/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_certs:/config
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
